openapi: 3.0.3
info:
  title: Motor do fechamento — contrato comum do spike
  version: "1.4.0"
  description: |
    Contrato que as TRES spikes (.NET 10, Python e PHP) implementam exatamente igual.
    Semântica: docs/semantica-do-motor.md. O verificador chama só estas rotas.
    Nenhuma rota extra é exigida; rotas extras não são usadas pelo verificador.
    Sem autenticação no spike.
    1.4.0 (semântica v5, fase 4.5): contrato de tipo de fato na entrada (403 fonte_nao_autorizada,
    422 tipo_desconhecido e payload_invalido com violacoes), chave_idempotencia, efeitos obsoleto e
    conflito_fonte, campo repetido.
servers:
  - url: http://localhost:8081
    description: spike .NET
  - url: http://localhost:8082
    description: spike Python
  - url: http://localhost:8083
    description: spike PHP

paths:
  /health:
    get:
      summary: Saúde do serviço e do banco
      responses:
        "200":
          description: Serviço e banco respondendo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /competencias/abrir:
    post:
      summary: AbrirCompetencias (semântica §5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbrirCompetenciasRequest" }
      responses:
        "200":
          description: Casos criados ou já existentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbrirCompetenciasResponse" }
        "422": { $ref: "#/components/responses/Invalido" }

  /fatos:
    post:
      summary: PublicarFato (semântica §6)
      description: |
        422 corpo_invalido também quando o payload tem número que não seja inteiro int64 (fração,
        expoente, -0, fora da faixa), chave duplicada, substituto Unicode isolado ou mais de 64
        níveis; valor_centavos só aceita inteiro int64 ou null. O corpo é validado por inteiro
        antes de qualquer gravação.
        v5 (§6.1 a §6.4): depois da forma, o corpo é validado contra o contrato ativo do tipo, nesta
        ordem: tipo (422 tipo_desconhecido), fonte (403 fonte_nao_autorizada), qualificador, valor e
        payload (422 payload_invalido, com violacoes). Erro = nada gravado (nem recebimento).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FatoRequest" }
      responses:
        "200":
          description: Recebido. O efeito diz se virou fato (novo, nova_versao) ou não (sem_mudanca, obsoleto, conflito_fonte)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FatoResponse" }
        "403": { $ref: "#/components/responses/FonteNaoAutorizada" }
        "422": { $ref: "#/components/responses/Invalido" }

  /casos/{titular_id}/{competencia}:
    get:
      summary: Consulta do caso
      parameters:
        - $ref: "#/components/parameters/TitularId"
        - $ref: "#/components/parameters/Competencia"
      responses:
        "200":
          description: Caso, entregáveis, tarefas abertas e exceções abertas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasoResponse" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /casos/{titular_id}/{competencia}/entregaveis/{tipo}/concluir:
    post:
      summary: ConcluirTarefa de entregável humano (semântica §8)
      description: |
        A forma do corpo (inclusive as regras de payload do §6 em TODAS as saídas) é validada antes
        de qualquer consulta ou gravação: 422 corpo_invalido sem efeito parcial. Depois: 404, 409 e
        422 por entregável sem saída na regra.
        v5 (§8 passo 3a): depois disso, cada saída é validada contra o contrato ativo de saida.tipo
        (fonte 'tarefa'), antes de gravar qualquer coisa: 403 fonte_nao_autorizada ou 422
        payload_invalido com violacoes; erro em uma saída rejeita o pedido inteiro.
      parameters:
        - $ref: "#/components/parameters/TitularId"
        - $ref: "#/components/parameters/Competencia"
        - $ref: "#/components/parameters/TipoEntregavel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConcluirRequest" }
      responses:
        "200":
          description: Tarefa concluída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntregavelEstado" }
        "403": { $ref: "#/components/responses/FonteNaoAutorizada" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }
        "422": { $ref: "#/components/responses/Invalido" }

  /casos/{titular_id}/{competencia}/entregaveis/{tipo}/override:
    post:
      summary: RegistrarOverride de conferência divergente (semântica §8.1; cenário C9)
      description: |
        Validação nesta ordem: 422 (corpo), 404 (caso ou entregável), 409 (entregável fora de
        'divergente', ou a conferência vigente da CF não é divergente B sem override).
      parameters:
        - $ref: "#/components/parameters/TitularId"
        - $ref: "#/components/parameters/Competencia"
        - $ref: "#/components/parameters/TipoEntregavel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideRequest" }
      responses:
        "200":
          description: Override registrado. Estado devolvido é o do entregável depois do override (validado, se não restar divergência B)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntregavelEstado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/Conflito" }
        "422": { $ref: "#/components/responses/Invalido" }

  /admin/fila:
    get:
      summary: Estado da fila. pendentes = 0 só quando todo efeito já está gravado (semântica §13)
      responses:
        "200":
          description: Contagens da fila
          content:
            application/json:
              schema:
                type: object
                required: [pendentes, com_erro]
                properties:
                  pendentes: { type: integer, minimum: 0 }
                  com_erro: { type: integer, minimum: 0 }

components:
  parameters:
    TitularId:
      name: titular_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    Competencia:
      name: competencia
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{4}(0[1-9]|1[0-2])$" }
    TipoEntregavel:
      name: tipo
      in: path
      required: true
      schema: { type: string, enum: [E01, E02, E03, E04, E05, E06, E07, E08, E10, E11, E12] }

  responses:
    NaoEncontrado:
      description: Caso ou entregável inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Conflito:
      description: Estado não permite a operação
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    FonteNaoAutorizada:
      description: "v5: a fonte não está em fontes_permitidas do contrato ativo do tipo (erro = fonte_nao_autorizada). Nada gravado."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Invalido:
      description: |
        Corpo inválido (erro = corpo_invalido): JSON malformado, campo ausente ou de tipo errado etc.
        Em POST /fatos e /concluir, também: número do payload (ou valor_centavos) que não seja inteiro
        int64, chave duplicada, substituto Unicode isolado, U+0000 em qualquer string ou chave (também em
        campos de texto do corpo) ou profundidade acima de 64 (semântica §6).
        U+0000 em parâmetro de caminho é rejeitado com este 422 ou com 400 do servidor web (ambos conformes).
        v5: erro = tipo_desconhecido (tipo sem contrato ativo) ou payload_invalido (qualificador,
        valor_centavos ou payload fora do contrato ativo; vem com violacoes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }

  schemas:
    ValorJson:
      description: "Valor JSON do payload: número só como inteiro int64 (semântica §6)."
      nullable: true
      oneOf:
        - { type: integer, format: int64 }
        - { type: string }
        - { type: boolean }
        - type: array
          items: { $ref: "#/components/schemas/ValorJson" }
        - type: object
          additionalProperties: { $ref: "#/components/schemas/ValorJson" }

    Erro:
      type: object
      required: [erro, mensagem]
      properties:
        erro: { type: string, description: "código curto, ex.: 'entregavel_nao_pronto'" }
        mensagem: { type: string }
        violacoes:
          type: array
          description: "v5: só em payload_invalido. Uma entrada por regra violada; o verificador confere os campos, não o texto."
          items:
            type: object
            required: [campo, regra]
            properties:
              campo: { type: string, description: "'tributo', 'valor_centavos' ou caminho no payload, ex.: 'payload.competencia_impressa'; em /concluir, prefixado por 'saidas[i].'" }
              regra: { type: string, description: "ex.: 'obrigatorio', 'proibido', 'fora_da_lista', 'tipo', 'esquema'" }

    Empresa:
      type: object
      additionalProperties: false
      required: [titular_id, regime, tem_folha, tem_prolabore, tem_taxa_municipal, filial, carteira, municipio]
      properties:
        titular_id: { type: string, minLength: 1, maxLength: 64 }
        regime: { type: string, enum: [SN, LP] }
        tem_folha: { type: boolean }
        tem_prolabore: { type: boolean }
        tem_taxa_municipal: { type: boolean }
        filial: { type: boolean }
        carteira: { type: string, minLength: 1 }
        municipio: { type: string, minLength: 1 }
        sujeito_fator_r: { type: boolean, default: false, description: "v4 (M1): SN sujeito ao Fator R com pró-labore controlado pela Rissi. Opcional; ausente = false. Só o CF-08 usa (semântica §3)." }

    AbrirCompetenciasRequest:
      type: object
      additionalProperties: false
      required: [competencia, ator, empresas]
      properties:
        competencia: { type: string, pattern: "^[0-9]{4}(0[1-9]|1[0-2])$" }
        ator: { type: string, minLength: 1 }
        empresas:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/Empresa" }

    AbrirCompetenciasResponse:
      type: object
      required: [criados, existentes]
      properties:
        criados:
          type: array
          items:
            type: object
            required: [titular_id, caso_id]
            properties:
              titular_id: { type: string }
              caso_id: { type: string, format: uuid }
        existentes:
          type: array
          items:
            type: object
            required: [titular_id, caso_id]
            properties:
              titular_id: { type: string }
              caso_id: { type: string, format: uuid }

    FatoRequest:
      type: object
      additionalProperties: false
      required: [titular_id, competencia, tipo, fonte, observado_em]
      properties:
        titular_id: { type: string, minLength: 1, maxLength: 64 }
        competencia: { type: string, pattern: "^[0-9]{4}(0[1-9]|1[0-2])$" }
        tipo: { type: string, minLength: 1 }
        tributo: { type: string, default: "" }
        valor_centavos: { type: integer, format: int64, nullable: true }
        payload:
          type: object
          default: {}
          additionalProperties: { $ref: "#/components/schemas/ValorJson" }
          description: "Objeto livre cujos números são só inteiros int64 (sem fração, expoente ou -0), sem chave duplicada, até 64 níveis; caso contrário 422 corpo_invalido. Ver semântica §6."
        fonte: { type: string, minLength: 1 }
        origem_ref: { type: string, nullable: true }
        observado_em: { type: string, format: date-time, description: "v5: decide a ordem entre versões da mesma chave (§6.4)" }
        chave_idempotencia: { type: string, minLength: 1, maxLength: 200, nullable: true, description: "v5 (§6.5): mesma (fonte, chave) devolve a primeira resposta, com repetido = true, sem gravar nada" }

    FatoResponse:
      type: object
      required: [fato_id, versao, efeito]
      properties:
        fato_id: { type: string, format: uuid, description: "id da versão vigente após a operação (em obsoleto e conflito_fonte, a vigente que continuou vigente)" }
        versao: { type: integer }
        efeito: { type: string, enum: [novo, nova_versao, sem_mudanca, obsoleto, conflito_fonte] }
        repetido: { type: boolean, default: false, description: "v5: true quando a resposta é a de uma chave_idempotencia já recebida" }

    ConcluirRequest:
      type: object
      additionalProperties: false
      required: [ator, saidas]
      properties:
        ator: { type: string, minLength: 1 }
        saidas:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              tributo: { type: string, default: "" }
              valor_centavos: { type: integer, format: int64, nullable: true }
              payload:
                type: object
                default: {}
                additionalProperties: { $ref: "#/components/schemas/ValorJson" }
                description: "Objeto livre cujos números são só inteiros int64 (sem fração, expoente ou -0), sem chave duplicada, até 64 níveis; caso contrário 422 corpo_invalido. Ver semântica §6."

    OverrideRequest:
      type: object
      additionalProperties: false
      required: [ator, cf, motivo]
      properties:
        ator: { type: string, minLength: 1 }
        cf: { type: string, pattern: "^CF-[0-9]{2}$" }
        motivo: { type: string, minLength: 5 }

    EntregavelEstado:
      type: object
      required: [entregavel_id, tipo, estado]
      properties:
        entregavel_id: { type: string, format: uuid }
        tipo: { type: string }
        estado: { type: string }

    CasoResponse:
      type: object
      required: [caso_id, titular_id, competencia, estado, entregaveis, tarefas_abertas, excecoes_abertas]
      properties:
        caso_id: { type: string, format: uuid }
        titular_id: { type: string }
        competencia: { type: string }
        estado: { type: string, enum: [aberto, encerrado, reaberto] }
        entregaveis:
          type: array
          items:
            type: object
            required: [entregavel_id, tipo, estado, executor]
            properties:
              entregavel_id: { type: string, format: uuid }
              tipo: { type: string }
              estado: { type: string }
              executor: { type: string, enum: [sistema, humano] }
        tarefas_abertas:
          type: array
          items:
            type: object
            required: [tarefa_id, entregavel_tipo]
            properties:
              tarefa_id: { type: string, format: uuid }
              entregavel_tipo: { type: string }
        excecoes_abertas:
          type: array
          items:
            type: object
            required: [excecao_id, tipo, classe]
            properties:
              excecao_id: { type: string, format: uuid }
              tipo: { type: string }
              classe: { type: string, enum: [S, O] }
