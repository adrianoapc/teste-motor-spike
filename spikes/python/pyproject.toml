[project]
name = "motor"
version = "0.1.0"
description = "Spike Python do motor do fechamento (fase 1: C1 e C7)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "mypy==1.14.1",
    "ruff==0.8.6",
    "import-linter==2.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["motor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
